[project]
name = "gsyncio-fastapi-demo"
version = "0.1.0"
description = "FastAPI demo website deployed on gsyncio (multi-event-loop engine for Python 3.14t)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "gsyncio>=0.1.0",
]

# uvicorn 仅供 benchmark.py 压测对比使用（demo 服务器本身用
# GsyncioASGIWorker，不需要 uvicorn）。
[dependency-groups]
dev = [
    "uvicorn>=0.30",
]
